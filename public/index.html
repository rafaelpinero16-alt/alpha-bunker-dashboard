<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="api-base" content="">
<title>Alpha Bunker Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#141c24; --plate:#1b2530; --plate-2:#223040; --rivet:#2e3d4d;
  --paper:#e4e8ec; --muted:#8d9bab; --signal:#f0a830; --signal-ink:#1d1405;
  --go:#4fd18b; --stop:#ef6461;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--steel);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background-image:linear-gradient(var(--rivet) 1px,transparent 1px),linear-gradient(90deg,var(--rivet) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(20,28,36,.55),var(--steel) 70%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 18px 64px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
h2{font-size:1.35rem}
p{margin:0}
.muted{color:var(--muted)}

/* Barra superior */
.top{display:flex;align-items:center;gap:12px;padding:14px 0;position:sticky;top:0;z-index:5;background:linear-gradient(var(--steel) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.05rem;font-weight:700;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.75rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status[data-s="online"] i{background:var(--go);box-shadow:0 0 0 3px rgba(79,209,139,.18)}
.status[data-s="offline"] i{background:var(--stop)}
.status[data-s="preview"] i{background:var(--signal)}
.lang{background:var(--plate);border:1px solid var(--rivet);border-radius:var(--r-sm);padding:6px 8px;font-size:.85rem}

/* Hero: dial de la puerta blindada */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:18px 0 26px}
.dial{position:relative;width:168px;height:168px}
.dial svg{width:100%;height:100%;display:block}
.dial .tick{stroke:var(--rivet);stroke-width:3;stroke-linecap:round;transition:stroke .25s}
.dial .tick.lit{stroke:var(--signal)}
.dial .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial .core strong{font-family:var(--display);font-size:3rem;line-height:1;font-weight:700}
.dial .core span{font-size:.8rem;color:var(--muted);margin-top:4px}
.hero h1{font-size:1.75rem;line-height:1.15;margin-bottom:6px}
.hero .line{color:var(--muted);margin-bottom:14px}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem}
.kv div{display:flex;gap:6px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--display);font-weight:600}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:start}.dial{width:148px;height:148px}}

.note{border:1px dashed var(--signal);border-radius:var(--r-md);padding:12px 14px;color:var(--paper);background:rgba(240,168,48,.06);margin-bottom:24px;font-size:.92rem}

/* Secciones */
section{margin-top:30px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head p{font-size:.88rem}

/* Comunidades */
.list{border:1px solid var(--rivet);border-radius:var(--r-lg);background:var(--plate);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--rivet)}
.row:first-child{border-top:0}
.row .avatar{width:38px;height:38px;border-radius:50%;background:var(--plate-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none;border:1px solid var(--rivet)}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .meta small{color:var(--muted);font-size:.82rem}
.flag{font-size:.74rem;padding:1px 7px;margin-right:6px;border-radius:99px;border:1px solid currentColor}
.flag.ok{color:var(--go)} .flag.warn{color:var(--signal)}
.empty{padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Botones */
.btn{appearance:none;border:1px solid var(--rivet);background:var(--plate-2);border-radius:var(--r-sm);padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--paper)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--stop);background:transparent;border-color:transparent;padding:6px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center;padding:12px}

/* Escalera de planes */
.ladder{position:relative;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:stretch}
.step .lvl{display:flex;flex-direction:column;align-items:center}
.step .lvl b{font-family:var(--display);font-size:1.5rem;width:54px;height:54px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--plate);border:1px solid var(--rivet)}
.step .lvl::after{content:"";flex:1;width:2px;background:var(--rivet);margin-top:6px}
.step:last-child .lvl::after{display:none}
.step .card{background:var(--plate);border:1px solid var(--rivet);border-radius:var(--r-md);padding:14px 16px}
.step .card header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.step .card h3{font-size:1.1rem}
.step .price{font-family:var(--display);font-size:1.25rem;font-weight:700;white-space:nowrap}
.step .card ul{margin:10px 0 12px;padding-left:18px;color:var(--paper);font-size:.9rem}
.step .card li{margin:2px 0}
.step.top .lvl b{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.step.top .card{border-color:var(--signal)}

/* Modales (hoja inferior) */
.overlay{position:fixed;inset:0;background:rgba(8,12,16,.7);display:none;z-index:20;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--plate);border:1px solid var(--rivet);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0))}
.overlay.open .sheet{animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.x{background:none;border:0;font-size:1.4rem;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.summary{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:var(--r-md);background:var(--plate-2);margin-bottom:16px}
.summary b{font-family:var(--display);font-size:1.2rem}
.gw{display:flex;flex-direction:column;gap:8px;margin:8px 0 16px}
.gw label{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--rivet);border-radius:var(--r-md);cursor:pointer;background:var(--steel)}
.gw label:has(input:checked){border-color:var(--signal);background:rgba(240,168,48,.07)}
.gw label.off{opacity:.45;cursor:not-allowed}
.gw input{accent-color:var(--signal)}
.gw .gname{flex:1}
.gw small{color:var(--muted)}
.callout{padding:12px 14px;border-radius:var(--r-md);background:var(--plate-2);font-size:.92rem;margin-bottom:14px}

/* Formularios */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rivet);margin-bottom:16px}
.tabs button{background:none;border:0;padding:10px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--signal)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:.88rem;font-weight:500}
.field small{color:var(--muted);font-size:.8rem}
.input,select.input,textarea.input{width:100%;background:var(--steel);border:1px solid var(--rivet);border-radius:var(--r-sm);padding:10px 12px}
textarea.input{min-height:84px;resize:vertical}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;margin-bottom:8px}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--rivet);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:transform .15s}
.switch input:checked{background:var(--signal)}
.switch input:checked::after{transform:translateX(18px)}
.rules{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.rule{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--rivet);border-radius:var(--r-md);background:var(--steel);font-size:.9rem}
.rule .flow{flex:1;min-width:0}
.rule .flow b{color:var(--signal);font-weight:600}
.rule .flow p{color:var(--muted);font-size:.82rem;margin-top:2px;overflow-wrap:anywhere}
.builder{border:1px solid var(--rivet);border-radius:var(--r-md);padding:14px;background:var(--plate-2)}
.builder .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.builder .pair{grid-template-columns:1fr}}
.tpl{padding:14px;border:1px solid var(--rivet);border-radius:var(--r-md);margin-bottom:10px;background:var(--steel);display:flex;gap:12px;align-items:flex-start}
.tpl .ico{font-size:1.5rem;line-height:1}
.tpl div{flex:1}
.tpl p{color:var(--muted);font-size:.88rem;margin:2px 0 10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--steel);padding:10px 16px;border-radius:var(--r-md);font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--stop);color:#fff}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <path d="M17 2 30 7v9c0 8-5.6 13.6-13 16C9.6 29.6 4 24 4 16V7z" fill="none" stroke="#f0a830" stroke-width="2"/>
        <circle cx="17" cy="16" r="5.5" fill="none" stroke="#e4e8ec" stroke-width="2"/>
        <path d="M17 10.5v-3M17 24.5v-3M11.5 16h-3M25.5 16h-3" stroke="#e4e8ec" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div><b>Alpha Bunker</b><small data-i18n="tagline"></small></div>
    </div>
    <div class="status" id="status" data-s="connecting" role="status"><i></i><span id="statusText"></span></div>
    <select class="lang" id="langSelect" aria-label="Idioma">
      <option value="es">ES</option><option value="en">EN</option><option value="it">IT</option>
      <option value="fr">FR</option><option value="de">DE</option><option value="pt">PT</option>
    </select>
  </header>

  <div class="hero">
    <div class="dial" aria-hidden="true">
      <svg viewBox="0 0 168 168" id="dialSvg"></svg>
      <div class="core"><strong id="dialNum">0</strong><span data-i18n="dial_label"></span></div>
    </div>
    <div>
      <h1 id="hello"></h1>
      <p class="line" id="heroLine"></p>
      <dl class="kv">
        <div><dt data-i18n="k_rules"></dt><dd id="kRules">0</dd></div>
        <div><dt data-i18n="k_subs"></dt><dd id="kSubs">0</dd></div>
        <div><dt data-i18n="k_bot"></dt><dd id="kBot">—</dd></div>
      </dl>
    </div>
  </div>

  <div class="note hidden" id="previewNote" data-i18n="preview_note"></div>

  <section aria-labelledby="commTitle">
    <div class="sec-head">
      <h2 id="commTitle" data-i18n="sec_comm"></h2>
      <button class="btn ghost" id="openTemplates" data-i18n="templates_btn"></button>
    </div>
    <div class="list" id="communityList"></div>
  </section>

  <section aria-labelledby="plansTitle">
    <div class="sec-head">
      <h2 id="plansTitle" data-i18n="sec_plans"></h2>
      <p class="muted" data-i18n="plans_sub"></p>
    </div>
    <div class="ladder" id="planLadder"></div>
  </section>
</div>

<!-- Modal: plantillas -->
<div class="overlay" id="tplModal" role="dialog" aria-modal="true" aria-labelledby="tplTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="tplTitle" data-i18n="tpl_title"></h2><button class="x" data-close aria-label="Cerrar">×</button></div>
    <p class="muted" style="margin-bottom:14px" data-i18n="tpl_sub"></p>
    <label class="field"><span data-i18n="tpl_target"></span><select class="input" id="tplTarget"></select></label>
    <div id="tplList"></div>
  </div>
</div>

<!-- Modal: checkout -->
<div class="overlay" id="checkoutModal" role="dialog" aria-modal="true" aria-labelledby="coTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="coTitle" data-i18n="co_title"></h2><button class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="summary"><span id="coPlan"></span><b id="coPrice"></b></div>
    <h3 style="font-size:1rem" data-i18n="co_method"></h3>
    <div class="gw" id="gatewayList"></div>
    <div class="callout hidden" id="coInfo"></div>
    <button class="btn primary block" id="coPay"></button>
    <button class="btn block hidden" id="coCheck" style="margin-top:8px" data-i18n="co_check"></button>
  </div>
</div>

<!-- Modal: comunidad -->
<div class="overlay" id="communityModal" role="dialog" aria-modal="true" aria-labelledby="cmTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="cmTitle"></h2><button class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="protect" data-i18n="cm_protect"></button>
      <button role="tab" aria-selected="false" data-tab="rules" data-i18n="cm_rules"></button>
    </div>
    <div id="tab-protect">
      <div class="switch"><span data-i18n="f_welcome_on"></span><input type="checkbox" id="sWelcomeOn"></div>
      <label class="field"><span data-i18n="f_welcome"></span><textarea class="input" id="sWelcome" maxlength="2000"></textarea><small data-i18n="f_welcome_hint"></small></label>
      <div class="switch"><span data-i18n="f_captcha"></span><input type="checkbox" id="sCaptcha"></div>
      <label class="field"><span data-i18n="f_timeout"></span><input class="input" type="number" id="sTimeout" min="30" max="3600" step="10"></label>
      <label class="field"><span data-i18n="f_black"></span><textarea class="input" id="sBlack"></textarea><small data-i18n="f_list_hint"></small></label>
      <label class="field"><span data-i18n="f_black_act"></span>
        <select class="input" id="sBlackAct">
          <option value="delete" data-i18n="a_delete"></option>
          <option value="delete_and_warn" data-i18n="a_warn"></option>
          <option value="kick" data-i18n="a_kick"></option>
        </select></label>
      <label class="field"><span data-i18n="f_roles"></span><input class="input" id="sRoles"><small data-i18n="f_list_hint"></small></label>
      <button class="btn primary block" id="saveSettings" data-i18n="save"></button>
    </div>
    <div id="tab-rules" class="hidden">
      <div class="rules" id="ruleList"></div>
      <div class="builder">
        <div class="pair">
          <label class="field"><span data-i18n="r_when"></span>
            <select class="input" id="rTrigger">
              <option value="command" data-i18n="t_command"></option>
              <option value="keyword" data-i18n="t_keyword"></option>
              <option value="join" data-i18n="t_join"></option>
            </select></label>
          <label class="field" id="rValueWrap"><span id="rValueLabel"></span><input class="input" id="rValue" maxlength="64"></label>
        </div>
        <label class="field"><span data-i18n="r_then"></span>
          <select class="input" id="rAction">
            <option value="send_message" data-i18n="x_send"></option>
            <option value="add_role" data-i18n="x_role"></option>
            <option value="kick" data-i18n="x_kick"></option>
            <option value="payment_wall" data-i18n="x_wall"></option>
          </select></label>
        <label class="field" id="pTextWrap"><span id="pTextLabel"></span><textarea class="input" id="pText" maxlength="2000"></textarea></label>
        <label class="field hidden" id="pRoleWrap"><span data-i18n="p_role"></span><input class="input" id="pRole" maxlength="64"></label>
        <label class="field hidden" id="pPlanWrap"><span data-i18n="p_plan"></span><select class="input" id="pPlan"></select></label>
        <button class="btn primary block" id="addRule" data-i18n="add_rule"></button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const API_BASE = (document.querySelector('meta[name="api-base"]').content || "").replace(/\/$/, "");
const IN_TELEGRAM = !!(tg && tg.initData);

const I18N = {
  es: {
    tagline:"Centro de mando de tus comunidades", st_connecting:"Conectando…", st_online:"Bot en línea", st_offline:"Sin conexión", st_preview:"Vista previa",

    dial_label:"protegidas", k_rules:"Reglas activas", k_subs:"Planes activos", k_bot:"Bot",
    preview_note:"Estás viendo una vista previa. Abre el dashboard desde el bot en Telegram para gestionar tus comunidades y comprar planes.",
    sec_comm:"Tus comunidades", comm_empty:"Añade el bot como administrador de tu grupo o canal y aparecerá aquí.", add_group:"Añadir a un grupo",
    adm_yes:"Protegida", adm_no:"Sin permisos", n_rules:"{n} reglas", manage:"Gestionar",
    sec_plans:"Planes", plans_sub:"Pago único. Cada nivel incluye todo lo anterior.", choose_plan:"Elegir plan",
    templates_btn:"Plantillas", tpl_title:"Plantillas listas", tpl_sub:"Aplica una configuración completa a una de tus comunidades en un paso.", tpl_target:"Comunidad", tpl_apply:"Aplicar plantilla", tpl_applied:"Plantilla aplicada", tpl_need:"Conecta una comunidad para usar plantillas.",
    co_title:"Finalizar compra", co_method:"Método de pago", co_pay:"Pagar {amount}", co_unavailable:"No disponible", co_manual:"Transferencia manual", co_working:"Creando la orden…", co_check:"Comprobar pago", co_opened:"Completa el pago en la ventana abierta y luego pulsa «Comprobar pago».", co_need_tg:"Abre el dashboard desde Telegram para pagar.",
    pay_ok:"Pago confirmado. Revisa el bot: allí está tu acceso.", pay_pending:"El pago aún no figura como confirmado.", pay_failed:"El pago no se completó.", pay_cancel:"Pago cancelado.",
    cm_protect:"Protección", cm_rules:"Reglas", f_welcome_on:"Enviar bienvenida", f_welcome:"Mensaje de bienvenida", f_welcome_hint:"Variables: {first_name}, {username}, {chat_title}. Admite HTML de Telegram.",
    f_captcha:"Captcha para nuevos miembros", f_timeout:"Tiempo para verificar (segundos)", f_black:"Palabras prohibidas", f_list_hint:"Sepáralas con comas.", f_black_act:"Si alguien las usa",
    a_delete:"Borrar el mensaje", a_warn:"Borrar y avisar", a_kick:"Borrar y expulsar", f_roles:"Roles automáticos al entrar", save:"Guardar cambios", saved:"Cambios guardados",
    r_empty:"Esta comunidad no tiene reglas. Crea la primera abajo.", r_when:"Cuando", r_then:"Entonces", r_value_cmd:"Comando (sin /)", r_value_kw:"Palabra o frase",
    t_command:"Alguien usa un comando", t_keyword:"Un mensaje contiene", t_join:"Alguien entra al grupo",

const GATEWAYS = [
  {id:"stars", icon:"⭐", name:"Telegram Stars"},
  {id:"paypal", icon:"🅿️", name:"PayPal"},
  {id:"binance", icon:"🪙", name:"Binance Pay"},
  {id:"global66", icon:"🌎", name:"Global66", manual:true},
  {id:"payoneer", icon:"💼", name:"Payoneer", manual:true}
];

const S = {lang:"es", config:null, info:null, plan:null, tx:null, community:null};
const $ = (id) => document.getElementById(id);

function esc(v){return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function t(key, vars){
  const s = (I18N[S.lang] && I18N[S.lang][key]) ?? I18N.es[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, n) => (n in vars ? vars[n] : m)) : s;
}
function planText(id){
  const table = PLAN_I18N[S.lang] || PLAN_I18N.es;
  return table[id] || PLAN_I18N.es[id] || [id, "", []];
}
function haptic(kind){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); }catch(e){} }

let toastTimer = null;
function toast(msg, isErr){
  const el = $("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
  haptic(isErr ? "error" : "success");
}

async function api(path, opts){
  const o = opts || {};
  const headers = {"Content-Type":"application/json"};
  if (tg && tg.initData) headers["X-Telegram-Init-Data"] = tg.initData;
  const res = await fetch(API_BASE + path, {method:o.method || "GET", headers, body:o.body ? JSON.stringify(o.body) : undefined});
  let data = null;
  try { data = await res.json(); } catch(e) { data = null; }
  if (!res.ok){
    const d = data && data.detail;
    const msg = res.status === 401 ? t("err_auth") : Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || res.statusText);
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return data;
}

/* ---------- i18n estático ---------- */
function applyI18n(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("langSelect").value = S.lang;
}

/* ---------- Estado de conexión ---------- */
function setStatus(state){
  $("status").dataset.s = state;
  $("statusText").textContent = t("st_" + state);
  $("kBot").textContent = state === "online" ? "OK" : state === "offline" ? "—" : "…";
}

/* ---------- Dial ---------- */
const TICKS = 40;
function buildDial(){
  const svg = $("dialSvg");
  let out = "";
  for (let i = 0; i < TICKS; i++){
    const a = (i / TICKS) * Math.PI * 2 - Math.PI / 2;
    const r1 = 72, r2 = i % 5 === 0 ? 60 : 64;
    const x1 = 84 + r1*Math.cos(a), y1 = 84 + r1*Math.sin(a), x2 = 84 + r2*Math.cos(a), y2 = 84 + r2*Math.sin(a);
    out += `<line class="tick" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  out += `<circle cx="84" cy="84" r="52" fill="none" stroke="#2e3d4d" stroke-width="1"/>`;
  svg.innerHTML = out;
}
function setDial(protectedCount, total){
  const lit = total > 0 ? Math.round((protectedCount / total) * TICKS) : 0;
  const ticks = $("dialSvg").querySelectorAll(".tick");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  ticks.forEach((el, i) => {
    el.classList.remove("lit");
    if (i < lit){
      if (reduce) el.classList.add("lit");
      else setTimeout(() => el.classList.add("lit"), 18 * i);
    }
  });
  $("dialNum").textContent = protectedCount;
}

/* ---------- Render ---------- */
function renderHero(){
  const info = S.info;
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const name = (info && info.user.first_name) || (tgUser && tgUser.first_name) || "";
  $("hello").textContent = name ? t("hello", {name}) : t("hello_guest");
  const st = info ? info.stats : {communities:0, protected:0, rules:0, active_subscriptions:0};
  $("heroLine").textContent = st.communities ? t("hero_line", {p:st.protected, t:st.communities}) : t("hero_none");
  $("kRules").textContent = st.rules;
  $("kSubs").textContent = st.active_subscriptions;
  setDial(st.protected, st.communities);
}

function addGroupUrl(){
  const u = S.config && S.config.bot_username;
  return u ? `https://t.me/${u}?startgroup=alpha&admin=delete_messages+restrict_members+invite_users+pin_messages` : null;
}

function renderCommunities(){
  const list = $("communityList");
  const items = S.info ? S.info.communities : [];
  if (!items.length){
    const url = addGroupUrl();
    list.innerHTML = `<div class="empty"><p class="muted">${esc(t("comm_empty"))}</p>${url ? `<button class="btn primary" id="addGroupBtn">${esc(t("add_group"))}</button>` : ""}</div>`;
    const b = $("addGroupBtn");
    if (b) b.onclick = () => openExternal(url, true);
    return;
  }
  list.innerHTML = items.map(c => `
    <div class="row">
      <div class="avatar">${esc((c.title || "?").trim().charAt(0).toUpperCase())}</div>
      <div class="meta"><b>${esc(c.title)}</b><small><span class="flag ${c.bot_is_admin ? "ok" : "warn"}">${esc(t(c.bot_is_admin ? "adm_yes" : "adm_no"))}</span> ${esc(t("n_rules", {n:c.rules_count}))}</small></div>
      <button class="btn" data-manage="${c.chat_id}">${esc(t("manage"))}</button>
    </div>`).join("");
  list.querySelectorAll("[data-manage]").forEach(b => b.onclick = () => openCommunity(Number(b.dataset.manage)));
}

function renderPlans(){
  const plans = (S.config && S.config.plans) || [];
  const ladder = $("planLadder");
  ladder.innerHTML = plans.map((p, i) => {
    const [name, desc, feats] = planText(p.id);
    return `<div class="step ${i === plans.length - 1 ? "top" : ""}">
      <div class="lvl"><b>${p.level}</b></div>
      <div class="card">
        <header><h3>${esc(name)}</h3><span class="price">$${Math.round(p.price_usd)}</span></header>
        <p class="muted">${esc(desc)}</p>
        <ul>${feats.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
        <button class="btn ${i === plans.length - 1 ? "primary" : ""}" data-plan="${esc(p.id)}">${esc(t("choose_plan"))}</button>
      </div></div>`;
  }).join("");
  ladder.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => openCheckout(b.dataset.plan));
}

function renderAll(){
  applyI18n();
  setStatus($("status").dataset.s);
  renderHero();
  renderCommunities();
  renderPlans();
  if (S.plan && $("checkoutModal").classList.contains("open")) renderCheckout();
  if (S.community && $("communityModal").classList.contains("open")) { updateBuilder(); renderRules(); }
  if ($("tplModal").classList.contains("open")) renderTemplates();
}

/* ---------- Modales ---------- */
function openModal(id){
  $(id).classList.add("open");
  if (tg && tg.BackButton){ tg.BackButton.show(); }
}
function closeModal(id){
  $(id).classList.remove("open");
  if (tg && tg.BackButton && !document.querySelector(".overlay.open")) tg.BackButton.hide();
}
function closeTopModal(){
  const open = [...document.querySelectorAll(".overlay.open")];
  if (open.length) closeModal(open[open.length - 1].id);
}
document.querySelectorAll(".overlay").forEach(o => {
  o.addEventListener("click", e => { if (e.target === o || e.target.hasAttribute("data-close")) closeModal(o.id); });
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTopModal(); });

function openExternal(url, telegramLink){
  if (!url) return;
  if (tg && telegramLink && tg.openTelegramLink && url.startsWith("https://t.me/")) tg.openTelegramLink(url);
  else if (tg && tg.openLink) tg.openLink(url);
  else window.open(url, "_blank", "noopener");
}

/* ---------- Checkout ---------- */
function gatewayEnabled(id){ return !!(S.config && S.config.gateways && S.config.gateways[id]); }

function priceFor(plan, gateway){
  if (gateway === "stars"){
    const rate = (S.config && S.config.stars_per_usd) || 77;
    return Math.max(1, Math.round(plan.price_usd * rate)).toLocaleString() + " ⭐";
  }
  if (gateway === "binance") return Math.round(plan.price_usd) + " USDT";
  return "$" + Math.round(plan.price_usd) + " USD";
}

function openCheckout(planId){
  S.plan = (S.config.plans || []).find(p => p.id === planId);
  if (!S.plan) return;
  S.tx = null;
  const first = GATEWAYS.find(g => gatewayEnabled(g.id));
  S.gateway = first ? first.id : null;
  $("coInfo").classList.add("hidden");
  $("coCheck").classList.add("hidden");
  renderCheckout();
  openModal("checkoutModal");
}

function renderCheckout(){
  const plan = S.plan;
  $("coPlan").textContent = planText(plan.id)[0];
  $("coPrice").textContent = priceFor(plan, S.gateway || "paypal");
  $("gatewayList").innerHTML = GATEWAYS.map(g => {
    const on = gatewayEnabled(g.id);
    const sub = !on ? t("co_unavailable") : g.manual ? t("co_manual") : "";
    return `<label class="${on ? "" : "off"}"><input type="radio" name="gw" value="${g.id}" ${on ? "" : "disabled"} ${S.gateway === g.id ? "checked" : ""}>
      <span>${g.icon}</span><span class="gname">${esc(g.name)}</span><small>${esc(sub)}</small></label>`;
  }).join("");
  $("gatewayList").querySelectorAll("input").forEach(r => r.onchange = () => { S.gateway = r.value; $("coPrice").textContent = priceFor(plan, S.gateway); updatePayButton(); });
  updatePayButton();
}

function updatePayButton(){
  const btn = $("coPay");
  btn.textContent = t("co_pay", {amount: priceFor(S.plan, S.gateway || "paypal")});
  btn.disabled = !S.gateway || !IN_TELEGRAM;
  if (!IN_TELEGRAM){ showInfo(t("co_need_tg")); }
}
function showInfo(text){ const el = $("coInfo"); el.textContent = text; el.classList.remove("hidden"); }

$("coPay").onclick = async () => {
  if (!S.plan || !S.gateway) return;
  const btn = $("coPay");
  btn.disabled = true; btn.textContent = t("co_working");
  try{
    const res = await api("/api/v1/dashboard/checkout/create-order", {method:"POST", body:{plan_id:S.plan.id, gateway:S.gateway}});
    S.tx = res.transaction_id;
    if (res.invoice_link){
      if (tg && tg.openInvoice){
        tg.openInvoice(res.invoice_link, status => {
          if (status === "paid"){ toast(t("pay_ok")); closeModal("checkoutModal"); setTimeout(loadUser, 1500); }
          else if (status === "cancelled") toast(t("pay_cancel"));
          else if (status === "failed") toast(t("pay_failed"), true);
        });
      } else openExternal(res.invoice_link, true);
    } else if (res.payment_url){
      openExternal(res.payment_url, false);
      showInfo(t("co_opened"));
      $("coCheck").classList.remove("hidden");
    } else if (res.instructions){
      showInfo(res.instructions);
    }
  }catch(e){ toast(t("err", {e:e.message}), true); }
  finally{ updatePayButton(); }
};

$("coCheck").onclick = async () => {
  if (!S.tx) return;
  try{
    const res = await api(`/api/v1/dashboard/checkout/${encodeURIComponent(S.tx)}/verify`, {method:"POST"});
    const st = res.transaction.status;
    if (st === "completed"){ toast(t("pay_ok")); closeModal("checkoutModal"); loadUser(); }
    else if (st === "failed") toast(t("pay_failed"), true);
    else toast(t("pay_pending"));
  }catch(e){ toast(t("err", {e:e.message}), true); }
};

/* ---------- Comunidad: protección y reglas ---------- */
function splitList(v){ return v.split(",").map(s => s.trim()).filter(Boolean); }

async function openCommunity(chatId){
  try{
    const [s, r] = await Promise.all([
      api(`/api/v1/dashboard/communities/${chatId}/settings`),
      api(`/api/v1/dashboard/communities/${chatId}/rules`)
    ]);
    S.community = {chat_id:chatId, title:s.title, settings:s.settings, rules:r.rules};
    $("cmTitle").textContent = s.title;
    fillSettings(s.settings);
    selectTab("protect");
    updateBuilder();
    renderRules();
    openModal("communityModal");
  }catch(e){ toast(t("err", {e:e.message}), true); }
}

function fillSettings(st){
  $("sWelcomeOn").checked = st.welcome_enabled;
  $("sWelcome").value = st.welcome_message;
  $("sCaptcha").checked = st.captcha_enabled;
  $("sTimeout").value = st.captcha_timeout;
  $("sBlack").value = st.blacklist.join(", ");
  $("sBlackAct").value = st.blacklist_action;
  $("sRoles").value = st.auto_roles.join(", ");
}

function selectTab(name){
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  $("tab-protect").classList.toggle("hidden", name !== "protect");
  $("tab-rules").classList.toggle("hidden", name !== "rules");
}
document.querySelectorAll(".tabs [data-tab]").forEach(b => b.onclick = () => selectTab(b.dataset.tab));

$("saveSettings").onclick = async () => {
  const c = S.community; if (!c) return;
  const timeout = Math.min(3600, Math.max(30, parseInt($("sTimeout").value, 10) || 120));
  const body = {
    welcome_enabled:$("sWelcomeOn").checked, welcome_message:$("sWelcome").value,
    captcha_enabled:$("sCaptcha").checked, captcha_timeout:timeout,
    blacklist:splitList($("sBlack").value), blacklist_action:$("sBlackAct").value,
    auto_roles:splitList($("sRoles").value)
  };
  try{
    const res = await api(`/api/v1/dashboard/communities/${c.chat_id}/settings`, {method:"POST", body});
    c.settings = res.settings; fillSettings(res.settings); toast(t("saved"));
  }catch(e){ toast(t("err", {e:e.message}), true); }
};

function describeRule(r){
  const trig = {command:"t_command", keyword:"t_keyword", join:"t_join"}[r.trigger_type];
  const act = {send_message:"x_send", add_role:"x_role", kick:"x_kick", payment_wall:"x_wall"}[r.action_type];
  const val = r.trigger_type === "command" ? " /" + r.trigger_value : r.trigger_type === "keyword" ? ` “${r.trigger_value}”` : "";
  let detail = "";
  if (r.action_type === "send_message") detail = r.payload.text;
  else if (r.action_type === "add_role") detail = r.payload.role;
  else if (r.action_type === "kick") detail = r.payload.reason || "";
  else if (r.action_type === "payment_wall") detail = planText(r.payload.plan_id)[0];
  return `<b>${esc(t(trig))}${esc(val)}</b> → ${esc(t(act))}${detail ? `<p>${esc(detail)}</p>` : ""}`;
}

function renderRules(){
  const c = S.community; const box = $("ruleList");
  if (!c.rules.length){ box.innerHTML = `<p class="muted">${esc(t("r_empty"))}</p>`; return; }
  box.innerHTML = c.rules.map(r => `<div class="rule"><div class="flow">${describeRule(r)}</div><button class="btn danger" data-del="${esc(r.block_id)}">${esc(t("del"))}</button></div>`).join("");
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    try{
      await api(`/api/v1/dashboard/communities/${c.chat_id}/rules/${encodeURIComponent(b.dataset.del)}`, {method:"DELETE"});
      c.rules = c.rules.filter(r => r.block_id !== b.dataset.del); renderRules(); toast(t("rule_deleted"));
    }catch(e){ toast(t("err", {e:e.message}), true); }
  });
}

function updateBuilder(){
  const trig = $("rTrigger").value, act = $("rAction").value;
  $("rValueWrap").classList.toggle("hidden", trig === "join");
  $("rValueLabel").textContent = t(trig === "command" ? "r_value_cmd" : "r_value_kw");
  $("pTextWrap").classList.toggle("hidden", act === "add_role");
  $("pTextLabel").textContent = t(act === "kick" ? "p_reason" : act === "payment_wall" ? "p_wall_text" : "p_text");
  $("pRoleWrap").classList.toggle("hidden", act !== "add_role");
  $("pPlanWrap").classList.toggle("hidden", act !== "payment_wall");
  const plans = (S.config && S.config.plans) || [];
  const current = $("pPlan").value;
  $("pPlan").innerHTML = plans.map(p => `<option value="${esc(p.id)}">${esc(planText(p.id)[0])} ($${Math.round(p.price_usd)})</option>`).join("");
  if (current) $("pPlan").value = current;
}
$("rTrigger").onchange = updateBuilder;
$("rAction").onchange = updateBuilder;

$("addRule").onclick = async () => {
  const c = S.community; if (!c) return;
  const act = $("rAction").value;
  const payload = {};
  if (act === "send_message") payload.text = $("pText").value.trim();
  if (act === "kick") payload.reason = $("pText").value.trim();
  if (act === "payment_wall"){ payload.plan_id = $("pPlan").value; if ($("pText").value.trim()) payload.text = $("pText").value.trim(); }
  if (act === "add_role") payload.role = $("pRole").value.trim();
  const body = {trigger_type:$("rTrigger").value, trigger_value:$("rValue").value.trim(), action_type:act, payload};
  try{
    const res = await api(`/api/v1/dashboard/communities/${c.chat_id}/rules`, {method:"POST", body});
    c.rules.push(res.rule); renderRules();
    $("rValue").value = ""; $("pText").value = ""; $("pRole").value = "";
    toast(t("rule_added"));
  }catch(e){ toast(t("err", {e:e.message}), true); }
};

/* ---------- Plantillas ---------- */
function templateConfig(index){
  const tx = (TEMPLATES[S.lang] || TEMPLATES.es)[index];
  const welcome = tx[3];
  if (index === 0) return {
    settings:{welcome_enabled:true, welcome_message:welcome, captcha_enabled:true, captcha_timeout:120},
    rules:[{trigger_type:"command", trigger_value:"vip", action_type:"payment_wall", payload:{plan_id:"paid_channels"}}]
  };
  if (index === 1) return {
    settings:{welcome_enabled:true, welcome_message:welcome, captcha_enabled:true, captcha_timeout:90,
      blacklist:["casino","airdrop","onlyfans","t.me/+","bit.ly","giveaway","free crypto"], blacklist_action:"delete_and_warn", auto_roles:["Nuevo"]},
    rules:[]
  };
  return {
    settings:{welcome_enabled:true, welcome_message:welcome},
    rules:[
      {trigger_type:"command", trigger_value:"catalogo", action_type:"send_message", payload:{text:tx[4]}},
      {trigger_type:"keyword", trigger_value:S.lang === "en" ? "shipping" : S.lang === "de" ? "versand" : S.lang === "fr" ? "livraison" : S.lang === "it" ? "spedizion" : S.lang === "pt" ? "entrega" : "envío", action_type:"send_message", payload:{text:tx[5]}}
    ]
  };
}

function renderTemplates(){
  const comms = S.info ? S.info.communities : [];
  const sel = $("tplTarget");
  const prev = sel.value;
  sel.innerHTML = comms.map(c => `<option value="${c.chat_id}">${esc(c.title)}</option>`).join("");
  if (prev) sel.value = prev;
  sel.disabled = !comms.length;
  const list = TEMPLATES[S.lang] || TEMPLATES.es;
  $("tplList").innerHTML = (!comms.length ? `<p class="callout">${esc(t("tpl_need"))}</p>` : "") + list.map((tp, i) => `
    <div class="tpl"><span class="ico">${tp[0]}</span><div><h3 style="font-size:1rem">${esc(tp[1])}</h3><p>${esc(tp[2])}</p>
    <button class="btn" data-tpl="${i}" ${comms.length ? "" : "disabled"}>${esc(t("tpl_apply"))}</button></div></div>`).join("");
  $("tplList").querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => applyTemplate(Number(b.dataset.tpl), b));
}

async function applyTemplate(index, btn){
  const chatId = Number($("tplTarget").value);
  if (!chatId) return;
  const cfg = templateConfig(index);
  btn.disabled = true;
  try{
    await api(`/api/v1/dashboard/communities/${chatId}/settings`, {method:"POST", body:cfg.settings});
    for (const rule of cfg.rules){
      await api(`/api/v1/dashboard/communities/${chatId}/rules`, {method:"POST", body:rule});
    }
    toast(t("tpl_applied"));
    await loadUser();
  }catch(e){ toast(t("err", {e:e.message}), true); }
  finally{ btn.disabled = false; }
}

$("openTemplates").onclick = () => { renderTemplates(); openModal("tplModal"); };

/* ---------- Carga de datos ---------- */
async function loadConfig(){
  try{
    S.config = await api("/api/v1/dashboard/public-config");
    setStatus(S.config.bot_username ? (IN_TELEGRAM ? "online" : "preview") : "offline");
  }catch(e){
    S.config = {plans:[], gateways:{}, bot_username:null};
    setStatus("offline");
  }
}

async function loadUser(){
  if (!IN_TELEGRAM) return;
  try{
    S.info = await api("/api/v1/dashboard/user-info");
  }catch(e){
    toast(e.status === 401 ? t("err_auth") : t("err", {e:e.message}), true);
  }
  renderHero(); renderCommunities();
  if ($("tplModal").classList.contains("open")) renderTemplates();
}

function handleReturnParams(){
  const params = new URLSearchParams(location.search);
  const p = params.get("payment");
  if (!p) return;
  const map = {success:["pay_ok",false], pending:["pay_pending",false], failed:["pay_failed",true], cancelled:["pay_cancel",false]};
  if (map[p]) toast(t(map[p][0]), map[p][1]);
  history.replaceState(null, "", location.pathname);
}

$("langSelect").onchange = e => { S.lang = e.target.value; renderAll(); };

async function init(){
  if (tg){
    tg.ready();
    tg.expand();
    try{ tg.setHeaderColor("#141c24"); tg.setBackgroundColor("#141c24"); }catch(e){}
    if (tg.BackButton) tg.BackButton.onClick(closeTopModal);
  }
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const code = ((tgUser && tgUser.language_code) || navigator.language || "es").slice(0, 2).toLowerCase();
  S.lang = I18N[code] ? code : "es";
  buildDial();
  applyI18n();
  setStatus("connecting");
  $("previewNote").classList.toggle("hidden", IN_TELEGRAM);
  await loadConfig();
  if (IN_TELEGRAM){
    try{
      const info = await api("/api/v1/dashboard/user-info");
      S.info = info;
      if (info.user.language_code && I18N[info.user.language_code]) S.lang = info.user.language_code;
    }catch(e){ toast(e.status === 401 ? t("err_auth") : t("err", {e:e.message}), true); }
  }
  renderAll();
  handleReturnParams();
}
init();
</script>
